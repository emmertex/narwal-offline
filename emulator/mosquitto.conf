# mosquitto 2.x config — the offline MQTT broker (MQTT v5).
# Leaf cert must be signed by the SAME CA installed on the robot
# (pki/leaves/us-01.mqtt.narwaltech.com.pem from issue-leaves.sh).
#
# Install: place at /etc/mosquitto/conf.d/narwal-offline.conf and restart
# mosquitto (ensure no other listener conflicts on 8883).

per_listener_settings true

listener 8883
protocol mqtt
allow_anonymous true
certfile /etc/mosquitto/narwal-offline/us-01.mqtt.narwaltech.com.pem
keyfile  /etc/mosquitto/narwal-offline/us-01.mqtt.narwaltech.com.key

# The robot (client id prefix "sweeper_") and our app clients (app_*) share
# the /{productKey}/{deviceId}/... topic space. No ACLs offline.

max_queued_messages 10000
message_size_limit 1048576
log_dest file /var/log/mosquitto/narwal-offline.log
log_type all
