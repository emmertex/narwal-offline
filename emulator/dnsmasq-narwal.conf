# dnsmasq config: point every Narwal host at the emulator.
#
# Replace 10.2.100.2 with YOUR emulator IP, then merge into your dnsmasq
# (or run standalone on :53 with your DHCP handing out this host as DNS).
#   address=/narwaltech.com/IP  -> answers A locally for every subdomain
#   local=/narwaltech.com/      -> never forward; AAAA stays empty.
#     (the local=/ line is CRITICAL: the robot prefers IPv6 and would
#      otherwise leak around the A-record hijack to the real cloud)
#
# Verify:
#   dig @10.2.100.2 us-01.mqtt.narwaltech.com A    -> 10.2.100.2
#   dig @10.2.100.2 us-01.mqtt.narwaltech.com AAAA -> (no answer)

server=10.2.100.1
address=/narwaltech.com/10.2.100.2
local=/narwaltech.com/

log-queries
log-facility=/var/log/narwal-offline-dnsmasq.log
